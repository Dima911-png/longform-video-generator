name: Generate long-form educational video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (write in Russian or English)"
        required: true
        type: string
      language:
        description: "Narration language"
        required: true
        type: choice
        options: [Russian, English]
        default: Russian
      minutes:
        description: "Target duration in minutes"
        required: true
        type: choice
        options: ["10", "15", "20"]
        default: "10"

permissions:
  contents: read

concurrency:
  group: longform-video-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate narration script and storyboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TOPIC: ${{ inputs.topic }}
          VIDEO_LANGUAGE: ${{ inputs.language }}
          VIDEO_MINUTES: ${{ inputs.minutes }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add GEMINI_API_KEY in Settings → Secrets and variables → Actions."
            exit 1
          fi
          python scripts/auto_generate.py --topic "$VIDEO_TOPIC" --language "$VIDEO_LANGUAGE" --minutes "$VIDEO_MINUTES" --output projects/auto_video/segments.json

      - name: Generate AI images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_image.py batch --segments projects/auto_video/segments.json --output-dir projects/auto_video/images --delay 3

      - name: Verify all images were generated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("projects/auto_video/segments.json").read_text(encoding="utf-8"))
          segments=[s for c in data["chapters"] for s in c["segments"]]
          missing=[s["segment_id"] for s in segments if not (Path("projects/auto_video/images") / f'{s["segment_id"]}.png').exists()]
          if missing:
              raise SystemExit("Image generation failed for scenes: " + ", ".join(missing))
          print(f"Verified {len(segments)} scene images.")
          PY

      - name: Generate voiceover
        run: |
          python scripts/generate_voice.py batch --segments projects/auto_video/segments.json --output-dir projects/auto_video/audio

      - name: Verify all voiceover files were generated
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          data=json.loads(Path("projects/auto_video/segments.json").read_text(encoding="utf-8"))
          segments=[s for c in data["chapters"] for s in c["segments"]]
          missing=[]
          for scene in segments:
              path=Path("projects/auto_video/audio") / f'{scene["segment_id"]}.mp3'
              if not path.exists() or path.stat().st_size < 1000:
                  missing.append(scene["segment_id"]); continue
              probe=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",str(path)],capture_output=True,text=True)
              try:
                  if probe.returncode != 0 or float(probe.stdout.strip()) <= 0.1:
                      missing.append(scene["segment_id"])
              except ValueError:
                  missing.append(scene["segment_id"])
          if missing:
              raise SystemExit("Voice generation failed for scenes: " + ", ".join(missing))
          print(f"Verified {len(segments)} valid voiceover files.")
          PY

      - name: Create moving video scenes
        run: |
          python scripts/create_segment.py batch --segments projects/auto_video/segments.json --images-dir projects/auto_video/images --audio-dir projects/auto_video/audio --output-dir projects/auto_video/clips

      - name: Assemble video without subtitles
        run: |
          python scripts/assemble_video.py --clips-dir projects/auto_video/clips --output projects/auto_video/video-without-subtitles.mp4 --segments projects/auto_video/segments.json

      - name: Create synchronized subtitle file
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          data=json.loads(Path("projects/auto_video/segments.json").read_text(encoding="utf-8"))
          def duration(path):
              out=subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",str(path)],text=True)
              return float(out.strip())
          def stamp(seconds):
              ms=round(seconds*1000)
              h,ms=divmod(ms,3600000); m,ms=divmod(ms,60000); s,ms=divmod(ms,1000)
              return f"{h:02}:{m:02}:{s:02},{ms:03}"
          rows=[]; cursor=0.0; index=1
          for chapter in data["chapters"]:
              for scene in chapter["segments"]:
                  audio=Path("projects/auto_video/audio") / f'{scene["segment_id"]}.mp3'
                  audio_len=duration(audio)
                  words=" ".join(scene["narration"].split()).split()
                  # Split narration into readable chunks and distribute each across the audio duration.
                  chunks=[" ".join(words[i:i+7]) for i in range(0,len(words),7)]
                  usable=max(0.1,audio_len)
                  for j,chunk in enumerate(chunks):
                      start=cursor+0.5+usable*j/len(chunks)
                      end=cursor+0.5+usable*(j+1)/len(chunks)
                      rows.append(f"{index}\n{stamp(start)} --> {stamp(end)}\n{chunk}\n")
                      index+=1
                  cursor += audio_len + 1.0
          Path("projects/auto_video/subtitles.srt").write_text("\n".join(rows),encoding="utf-8")
          print(f"Created {index-1} subtitle cues.")
          PY

      - name: Burn subtitles into final video
        run: |
          ffmpeg -y -i projects/auto_video/video-without-subtitles.mp4 -vf "subtitles=projects/auto_video/subtitles.srt:force_style='FontName=DejaVu Sans,FontSize=22,PrimaryColour=&H00FFFFFF,OutlineColour=&H00101010,BorderStyle=1,Outline=2,Shadow=1,Alignment=2,MarginV=42'" -c:v libx264 -preset medium -crf 19 -c:a copy -movflags +faststart projects/auto_video/educational-video.mp4

      - name: Validate video duration and size
        run: |
          ffprobe -v error -show_entries format=duration,size -of json projects/auto_video/educational-video.mp4
          python - <<'PY'
          import json, subprocess
          path="projects/auto_video/educational-video.mp4"
          info=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration,size","-of","json",path]))
          seconds=float(info["format"]["duration"])
          print(f"Final video: {seconds/60:.2f} minutes; {int(info['format'].get('size',0))/1024/1024:.1f} MB")
          if seconds < 9*60:
              raise SystemExit("Generated video is shorter than 9 minutes; refusing to mark the run successful.")
          PY

      - name: Upload finished MP4 and project files
        uses: actions/upload-artifact@v4
        with:
          name: educational-video
          path: |
            projects/auto_video/educational-video.mp4
            projects/auto_video/segments.json
            projects/auto_video/subtitles.srt
            projects/auto_video/video-without-subtitles.chapters.txt
          if-no-files-found: error
          retention-days: 7
